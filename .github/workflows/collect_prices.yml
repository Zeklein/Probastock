name: Collecte quotidienne des cours

on:
  schedule:
    # 21:30 UTC, du lundi au vendredi : apres la cloture des marches US
    # (16:00 heure de New York = 20:00 UTC en heure d'ete, 21:00 UTC en heure d'hiver),
    # et bien apres la cloture de Londres (~16:30 UTC) et de Seoul (~06:30 UTC).
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python scripts/collect_prices.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
