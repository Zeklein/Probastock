<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Probastock — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f6f9;
    --card-bg: #ffffff;
    --text: #1a2233;
    --text-muted: #6b7280;
    --border: #e2e5ea;
    --green: #16a34a;
    --red: #dc2626;
    --pink: #db2777;        /* couleur REDUCE (badge + jauge), meme saturation que --green/--red */
    --pink-bg: #fce7f3;
    --sector-espace: #3b82f6;
    --sector-defense: #6b7280;
    --sector-tech: #8b5cf6;
    --sector-materiaux: #d97706;
    --sector-energie: #059669;
    --sector-telecoms: #0891b2;
    --sector-benchmark: #64748b;
    /* Fonds pastel par secteur (memes teintes que --sector-*, tres eclaircies) --
       contraste verifie avec --text (#1a2233) : toutes >10:1, largement AA. */
    --sector-espace-bg: #dbeafe;
    --sector-defense-bg: #e7e5e4;
    --sector-tech-bg: #ede9fe;
    --sector-materiaux-bg: #fef3c7;
    --sector-energie-bg: #d1fae5;
    --sector-telecoms-bg: #cffafe;
    --sector-benchmark-bg: #f1f5f9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 20px;
    margin: 0;
  }

  .tabs { display: flex; gap: 8px; }

  .tab-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-muted);
  }

  .tab-btn.active {
    background: var(--text);
    color: white;
    border-color: var(--text);
  }

  .btn-primary {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
  }

  .btn-primary:hover { background: #1d4ed8; }

  main { padding: 24px; max-width: 1400px; margin: 0 auto; }

  .hidden { display: none !important; }

  .sector-section {
    margin-bottom: 32px;
    border-left: 4px solid var(--sector-color, var(--sector-benchmark));
    padding-left: 16px;
  }

  .sector-section h2 {
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--sector-color, var(--sector-benchmark));
    margin: 0 0 12px 0;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    position: relative;
    cursor: pointer;
  }
  .card:hover { border-color: #94a3b8; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .ticker-row { display: flex; align-items: center; gap: 4px; }

  .star-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 0;
    color: var(--text-muted);
  }
  .star-btn.active { color: #d97706; }

  .ticker { font-weight: 700; font-size: 15px; }
  .name {
    font-size: 12px;
    color: var(--text-muted);
    margin: 2px 0 10px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .archive-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .archive-btn:hover { background: #fee2e2; color: var(--red); }

  .price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
  }

  .close-price { font-size: 20px; font-weight: 700; }

  .price-date { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .price-date.stale { color: var(--red); font-weight: 600; }

  .return-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
  }
  /* .news-badge est un <button> (clic pour ouvrir la fiche) -- reset des
     styles par defaut du navigateur pour garder l'apparence d'un badge. */
  .news-badge { border: none; font-family: inherit; cursor: pointer; }
  .return-up { color: var(--green); background: #dcfce7; }
  .return-down { color: var(--red); background: #fee2e2; }
  .return-flat { color: var(--text-muted); background: #f1f5f9; }

  /* Palette recommendation_finale : BUY/HOLD/SELL reutilisent les couleurs
     return-up/flat/down existantes (meme code couleur, pas de nouvelle
     teinte inventee) ; REDUCE en rose (--pink) -- distinct du secteur
     Materiaux (ambre) pour ne pas laisser croire a un lien entre les deux. */
  .reco-reduce { color: var(--pink); background: var(--pink-bg); }

  /* Badge "Signal technique" : volontairement different du badge recommendation_finale
     (fond plein) -- contour + fond transparent, pour ne jamais le confondre avec
     l'avis agrege des IA meme du coin de l'oeil. Memes couleurs BUY/SELL/NEUTRAL
     que le reste de l'app (vert/rouge/gris), juste un traitement visuel distinct. */
  .tech-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1.5px solid currentColor;
    background: transparent;
    display: inline-block;
    margin-top: 4px;
  }
  .tech-buy { color: var(--green); }
  .tech-sell { color: var(--red); }
  .tech-neutral { color: var(--text-muted); }

  .gauge-row { margin-bottom: 10px; }
  .gauge-label {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
  }
  /* 4 zones = seuils RECOMMENDATION_THRESHOLDS (app/aggregation.py) sur une
     echelle 0-100 : <35 SELL, 35-49 REDUCE, 50-61 HOLD, >=62 BUY. */
  .gauge-track {
    position: relative;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right,
      var(--red) 0%, var(--red) 35%,
      var(--pink) 35%, var(--pink) 50%,
      #e2e5ea 50%, #e2e5ea 62%,
      var(--green) 62%, var(--green) 100%);
  }
  .gauge-marker {
    position: absolute;
    top: -3px;
    width: 4px;
    height: 12px;
    background: var(--text);
    border-radius: 2px;
    transform: translateX(-50%);
  }

  .mini-badges-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .mini-badge { font-size: 10px; padding: 3px 7px; }
  /* Palier "moyen" partage par les badges volatilite/conviction -- les
     paliers haut/bas reutilisent return-up/return-down/return-flat deja
     existants, seul ce palier intermediaire n'avait pas d'equivalent. */
  .tier-medium { color: var(--sector-materiaux); background: var(--sector-materiaux-bg); }

  #add-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }

  #add-modal {
    background: white;
    border-radius: 10px;
    padding: 24px;
    width: 360px;
    max-width: 90vw;
  }

  #add-modal h3 { margin-top: 0; }

  .field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--text-muted); }
  .field input, .field select {
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }

  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  .btn-secondary {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    cursor: pointer;
  }

  #form-message {
    margin-top: 12px;
    font-size: 13px;
    padding: 10px;
    border-radius: 6px;
    display: none;
  }
  #form-message.ok { display: block; background: #dcfce7; color: #166534; }
  #form-message.err { display: block; background: #fee2e2; color: #991b1b; }

  table.archived-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
  table.archived-table th, table.archived-table td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  table.archived-table th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }

  .reactivate-btn {
    background: #dcfce7;
    color: #166534;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }

  .empty-note { color: var(--text-muted); font-size: 14px; padding: 20px 0; }

  .tracking-filters { margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
  .tracking-filters select { padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }

  .dashboard-toolbar {
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
  }
  .dashboard-toolbar select {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .dashboard-toolbar label { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
  .fav-filter-label { color: var(--text) !important; cursor: pointer; }

  .badge-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 24px;
    margin-bottom: 16px;
    padding: 10px 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .legend-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .legend-title { font-weight: 600; color: var(--text); }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .legend-dot.dot-green { background: var(--green); }
  .legend-dot.dot-amber { background: var(--sector-materiaux); }
  .legend-dot.dot-red { background: var(--red); }

  table.tracking-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden; font-size: 13px; }
  table.tracking-table th, table.tracking-table td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.tracking-table th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  table.tracking-table tr.ticker-group-start td { border-top: 2px solid var(--border); }
  table.tracking-table td.ticker-cell { font-weight: 700; }
  table.tracking-table tr.row-aggregate { background: #f8fafc; font-weight: 600; }

  .status-badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; display: inline-block; }
  .status-correct { color: var(--green); background: #dcfce7; }
  .status-incorrect { color: var(--red); background: #fee2e2; }
  .status-neutral { color: var(--text-muted); background: #f1f5f9; }
  .status-pending, .status-no_data { color: var(--text-muted); background: #f1f5f9; font-style: italic; }
  .status-return { font-size: 10px; color: var(--text-muted); margin-left: 4px; }

  #detail-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 20px;
    overflow-y: auto;
  }

  #detail-panel {
    background: var(--card-bg);
    border-radius: 10px;
    width: 100%;
    max-width: 1000px;
    padding: 24px 28px 28px;
  }

  #detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  #detail-header h2 { margin: 0; font-size: 22px; }
  #detail-header .sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

  .detail-close-btn {
    background: none;
    border: none;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    color: var(--text-muted);
  }
  .detail-close-btn:hover { color: var(--text); }

  .chart-section { margin-bottom: 22px; }
  .chart-section h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    margin: 0 0 8px 0;
  }

  .chart-main-wrap { height: 320px; }
  .chart-rsi-wrap { height: 140px; }
  .chart-volume-wrap { height: 140px; }

  .analysis-placeholder, .analysis-loading, .analysis-error {
    background: #f8fafc;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 20px;
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
  }
  .analysis-placeholder { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .analysis-error { color: var(--red); border-color: #fecaca; background: #fef2f2; display: flex; flex-direction: column; gap: 10px; align-items: center; }

  .analysis-result {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .analysis-header {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    font-size: 13px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .analysis-header .return-badge { font-size: 12px; padding: 4px 10px; }
  .analysis-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 12px;
  }
  .analysis-grid h4 { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin: 0 0 6px 0; }
  .analysis-grid ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
  .analysis-grid p { margin: 0 0 4px 0; font-size: 13px; }

  .news-subheading { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 14px 0 6px 0; }
  .news-subheading:first-child { margin-top: 0; }
  .news-item { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .news-item:last-child { border-bottom: none; }
  .news-item-title { font-size: 13px; font-weight: 600; }
  .news-item-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .news-item-summary { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .analysis-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }

  .conviction-row { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .conviction-label { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 4px; }
  .conviction-track { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .conviction-fill { height: 100%; border-radius: 3px; }

  .tech-signal-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .tech-justification { font-size: 14px; margin: 8px 0 6px 0; }
</style>
</head>
<body>

<header>
  <h1>Probastock</h1>
  <div class="tabs">
    <button class="tab-btn active" id="tab-dashboard-btn" onclick="showTab('dashboard')">Tableau de bord</button>
    <button class="tab-btn" id="tab-tracking-btn" onclick="showTab('tracking')">Suivi des prédictions</button>
    <button class="tab-btn" id="tab-archived-btn" onclick="showTab('archived')">Actions archivées</button>
  </div>
  <button class="btn-primary" onclick="openAddModal()">+ Ajouter une action</button>
</header>

<main>
  <div id="dashboard-view">
    <div class="dashboard-toolbar">
      <label class="fav-filter-label"><input type="checkbox" id="filter-favorites"> ★ Favoris uniquement</label>
      <label>Secteur : <select id="filter-sector"><option value="">Tous</option></select></label>
      <label>Zone : <select id="filter-zone"><option value="">Toutes</option></select></label>
      <label>Trier par :
        <select id="sort-select">
          <option value="sector">Secteur</option>
          <option value="alpha">Alphabétique</option>
          <option value="score">Score Probastock</option>
          <option value="variation">Variation du jour</option>
          <option value="zone">Zone géographique</option>
        </select>
      </label>
    </div>
    <div class="badge-legend">
      <div class="legend-group">
        <span class="legend-title">Volatilité (20j) :</span>
        <span class="legend-item"><span class="legend-dot dot-green"></span>&lt; 3% (faible)</span>
        <span class="legend-item"><span class="legend-dot dot-amber"></span>3-6% (moyenne)</span>
        <span class="legend-item"><span class="legend-dot dot-red"></span>&gt; 6% (élevée)</span>
      </div>
      <div class="legend-group">
        <span class="legend-title">Conviction :</span>
        <span class="legend-item"><span class="legend-dot dot-green"></span>≥ 0,80 (fort accord)</span>
        <span class="legend-item"><span class="legend-dot dot-amber"></span>0,50-0,80 (accord modéré)</span>
        <span class="legend-item"><span class="legend-dot dot-red"></span>&lt; 0,50 (désaccord marqué)</span>
      </div>
    </div>
    <div id="dashboard-cards"><div class="empty-note">Chargement…</div></div>
  </div>
  <div id="tracking-view" class="hidden">
    <div class="tracking-filters">
      <label for="tracking-ticker-select">Titre :</label>
      <select id="tracking-ticker-select" onchange="loadTracking(this.value || null)"></select>
    </div>
    <div id="tracking-table-wrap"><div class="empty-note">Chargement…</div></div>
  </div>
  <div id="archived-view" class="hidden"><div class="empty-note">Chargement…</div></div>
</main>

<div id="add-modal-overlay" class="hidden">
  <div id="add-modal">
    <h3>Ajouter une action</h3>
    <form id="add-form">
      <div class="field">
        <label>Ticker</label>
        <input type="text" id="f-ticker" required placeholder="ex: TSLA">
      </div>
      <div class="field">
        <label>Nom</label>
        <input type="text" id="f-name" required placeholder="ex: Tesla Inc">
      </div>
      <div class="field">
        <label>Secteur</label>
        <select id="f-sector"></select>
      </div>
      <div class="field">
        <label>Type</label>
        <select id="f-type">
          <option value="action">Action</option>
          <option value="ETF">ETF</option>
        </select>
      </div>
      <div id="form-message"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeAddModal()">Annuler</button>
        <button type="submit" class="btn-primary">Ajouter</button>
      </div>
    </form>
  </div>
</div>

<div id="detail-overlay" class="hidden">
  <div id="detail-panel">
    <div id="detail-header">
      <div>
        <h2 id="detail-ticker"></h2>
        <div class="sub"><span id="detail-name"></span> — <span id="detail-sector"></span></div>
      </div>
      <button class="detail-close-btn" onclick="closeDetail()">&times;</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<script>
const SECTOR_COLOR_VARS = {
  "Espace": "--sector-espace",
  "Défense": "--sector-defense",
  "Semi-conducteurs & Tech": "--sector-tech",
  "Matériaux stratégiques / Terres rares": "--sector-materiaux",
  "Énergie & Nucléaire": "--sector-energie",
  "Télécoms/Connectivité": "--sector-telecoms",
  "Benchmark": "--sector-benchmark",
};

function sectorColor(sector) {
  const varName = SECTOR_COLOR_VARS[sector] || "--sector-benchmark";
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

function sectorPastelBg(sector) {
  const varName = (SECTOR_COLOR_VARS[sector] || "--sector-benchmark") + "-bg";
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

// Au-dela de ce nombre de jours calendaires, une cloture n'est plus "juste le
// week-end" (jusqu'a 3 jours entre vendredi et lundi) mais probablement le
// signe d'une collecte en panne -- affichage en rouge plutot que discret.
const STALE_PRICE_DAYS = 4;

function fmtTradeDate(tradeDate) {
  if (!tradeDate) return { text: "", stale: false };
  const d = new Date(tradeDate + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = Math.round((today - d) / 86400000);
  const label = d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  const text = days === 0 ? `Clôture du jour (${label})` : `Clôture du ${label}`;
  return { text, stale: days > STALE_PRICE_DAYS };
}

function fmtReturn(r) {
  if (r === null || r === undefined) return { text: "—", cls: "return-flat" };
  const pct = (r * 100).toFixed(2);
  if (r > 0) return { text: `+${pct}%`, cls: "return-up" };
  if (r < 0) return { text: `${pct}%`, cls: "return-down" };
  return { text: `${pct}%`, cls: "return-flat" };
}

const RECO_CLASS = { BUY: "return-up", HOLD: "return-flat", REDUCE: "reco-reduce", SELL: "return-down" };

function recoBadge(recommendation, score) {
  if (!recommendation || score === null || score === undefined) return "";
  const cls = RECO_CLASS[recommendation] || "return-flat";
  return `<span class="return-badge ${cls}" title="Score Probastock agrégé (4 IA)">${recommendation} ${Math.round(score)}</span>`;
}

// Jauge de recommandation agrégée : remplace l'ancienne jauge RSI-14 sur les
// cartes (la section RSI de la fiche détaillée n'est pas concernée). Mêmes
// seuils que RECOMMENDATION_THRESHOLDS (app/aggregation.py) : <35 SELL,
// 35-49 REDUCE, 50-61 HOLD, >=62 BUY -- cf. le degrade CSS .gauge-track.
function recoGauge(recommendation, score) {
  if (score === null || score === undefined) return "";
  return `
    <div class="gauge-row">
      <div class="gauge-label"><span>Score Probastock</span><span>${recommendation || "—"} ${Math.round(score)}</span></div>
      <div class="gauge-track">
        <div class="gauge-marker" style="left:${score}%"></div>
      </div>
    </div>
  `;
}

// Seuils de volatilite (volatility_20d, ecart-type des rendements 20j) derives
// de la distribution reelle observee sur les 34 titres suivis (aout 2026) :
// min 0.84%, Q1 2.87%, mediane 4.02%, Q3 5.70%, max 9.20%. <3%/3-6%/>6% colle
// aux quartiles avec des bornes rondes faciles a lire plutot que des seuils
// arbitraires (~10 titres faible, ~17 moyenne, ~7 elevee sur l'echantillon actuel).
const VOLATILITY_LOW = 0.03;
const VOLATILITY_HIGH = 0.06;

function volatilityBadge(vol) {
  if (vol === null || vol === undefined) {
    return `<span class="return-badge return-flat mini-badge" title="Volatilité 20j">Volatility n/a</span>`;
  }
  const cls = vol < VOLATILITY_LOW ? "return-up" : vol <= VOLATILITY_HIGH ? "tier-medium" : "return-down";
  return `<span class="return-badge ${cls} mini-badge" title="Volatilité 20j (écart-type des rendements)">Volatility ${(vol * 100).toFixed(1)}%</span>`;
}

// Memes seuils/couleurs que la barre de conviction de la fiche detaillee
// (vert >=0.8, ambre 0.5-0.8, rouge <0.5).
function convictionMiniBadge(conviction) {
  if (conviction === null || conviction === undefined) return ""; // pas d'agregation ce jour -- badge absent, pas grise
  const cls = conviction >= 0.8 ? "return-up" : conviction >= 0.5 ? "tier-medium" : "return-down";
  return `<span class="return-badge ${cls} mini-badge" title="Conviction (accord entre les 4 providers)">Conviction ${conviction.toFixed(2)}</span>`;
}

// Zone neutre +/-0.15 alignee sur l'echelle de sentiment Alpha Vantage deja
// utilisee dans le projet (Bearish/Somewhat-Bearish/Neutral/Somewhat-Bullish/Bullish).
function newsBadge(count, avgSentiment) {
  if (!count) {
    return `<button class="return-badge return-flat mini-badge news-badge" title="Aucune news sur les 7 derniers jours — cliquer pour ouvrir la fiche">0 news</button>`;
  }
  let cls = "return-flat";
  let sentimentText = "";
  if (avgSentiment !== null && avgSentiment !== undefined) {
    cls = avgSentiment > 0.15 ? "return-up" : avgSentiment < -0.15 ? "return-down" : "return-flat";
    sentimentText = `, ${avgSentiment >= 0 ? "+" : ""}${avgSentiment.toFixed(2)}`;
  }
  return `<button class="return-badge ${cls} mini-badge news-badge" title="News des 7 derniers jours, toutes sources confondues — cliquer pour les voir">${count} news${sentimentText}</button>`;
}

function miniBadgesRow(asset) {
  return `
    <div class="mini-badges-row">
      ${volatilityBadge(asset.volatility_20d)}
      ${convictionMiniBadge(asset.conviction)}
      ${newsBadge(asset.news_count_7d, asset.news_avg_sentiment_7d)}
    </div>
  `;
}

const TECH_CLASS = { BUY: "tech-buy", SELL: "tech-sell", NEUTRAL: "tech-neutral" };

function technicalBadge(signal, justification) {
  if (!signal) return "";
  const cls = TECH_CLASS[signal] || "tech-neutral";
  return `<span class="tech-badge ${cls}" title="Signal technique RSI — indépendant de l'analyse IA : ${justification || ""}">Signal RSI : ${signal}</span>`;
}

function buildCard(asset) {
  const card = document.createElement("div");
  card.className = "card";
  card.style.background = sectorPastelBg(asset.sector);

  const ret = fmtReturn(asset.return_1d);
  const close = asset.close !== null && asset.close !== undefined ? asset.close.toFixed(2) : "N/A";
  const dateInfo = fmtTradeDate(asset.trade_date);

  card.innerHTML = `
    <div class="card-top">
      <div>
        <div class="ticker-row">
          <button class="star-btn${asset.is_favorite ? " active" : ""}" title="Favori">${asset.is_favorite ? "★" : "☆"}</button>
          <span class="ticker">${asset.ticker}</span>
        </div>
        <div class="name" title="${asset.name}">${asset.name}</div>
      </div>
      <button class="archive-btn" title="Archiver">Archiver</button>
    </div>
    <div class="price-row">
      <span class="close-price">${close}</span>
      <span class="return-badge ${ret.cls}">${ret.text}</span>
      ${recoBadge(asset.recommendation_finale, asset.score_agrege)}
    </div>
    <div>${technicalBadge(asset.technical_signal, asset.technical_justification)}</div>
    <div class="price-date${dateInfo.stale ? " stale" : ""}">${dateInfo.text}</div>
    ${recoGauge(asset.recommendation_finale, asset.score_agrege)}
    ${miniBadgesRow(asset)}
  `;

  card.addEventListener("click", () => openDetail(asset.ticker));
  card.querySelector(".archive-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    archiveTicker(asset.ticker, card);
  });
  card.querySelector(".star-btn").addEventListener("click", async (e) => {
    e.stopPropagation();
    const btn = e.currentTarget;
    const res = await fetch(`/api/assets/${encodeURIComponent(asset.ticker)}/favorite`, { method: "PATCH" });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(`Erreur : ${err.detail || res.statusText}`);
      return;
    }
    const data = await res.json();
    asset.is_favorite = data.is_favorite; // met a jour le cache dashboardAssets (meme objet reference)
    btn.textContent = data.is_favorite ? "★" : "☆";
    btn.classList.toggle("active", data.is_favorite);
    if (filterState.favoritesOnly && !data.is_favorite) renderDashboard(); // retire la carte si le filtre favoris est actif
  });
  card.querySelector(".news-badge").addEventListener("click", (e) => {
    e.stopPropagation();
    openDetail(asset.ticker, { scrollToNews: true });
  });

  return card;
}

const SECTOR_ORDER = ["Espace", "Défense", "Semi-conducteurs & Tech", "Matériaux stratégiques / Terres rares", "Énergie & Nucléaire", "Télécoms/Connectivité", "Benchmark"];

let dashboardAssets = []; // cache client, evite un refetch a chaque filtre/tri
const filterState = { favoritesOnly: false, sector: "", zone: "" };
let sortMode = "sector";

async function loadDashboard() {
  const res = await fetch("/api/dashboard");
  const data = await res.json();

  // Le backend groupe par secteur ({secteur: [actifs]}) -- on aplatit en une
  // liste unique avec le secteur porte par chaque actif, pour pouvoir filtrer/
  // trier librement cote client sans redemander l'API a chaque changement.
  dashboardAssets = Object.entries(data).flatMap(([sector, assets]) => assets.map(a => ({ ...a, sector })));

  populateSectorSelect(Object.keys(data));
  populateFilterSelects();
  renderDashboard();
}

function populateFilterSelects() {
  const sectorSelect = document.getElementById("filter-sector");
  const sectors = SECTOR_ORDER.filter(s => dashboardAssets.some(a => a.sector === s))
    .concat([...new Set(dashboardAssets.map(a => a.sector))].filter(s => !SECTOR_ORDER.includes(s)));
  sectorSelect.innerHTML = '<option value="">Tous</option>' + sectors.map(s => `<option value="${s}">${s}</option>`).join("");

  const zoneSelect = document.getElementById("filter-zone");
  const zones = [...new Set(dashboardAssets.map(a => a.geo_zone))].sort();
  zoneSelect.innerHTML = '<option value="">Toutes</option>' + zones.map(z => `<option value="${z}">${z}</option>`).join("");
}

function applyFiltersAndSort() {
  const list = dashboardAssets.filter(a =>
    (!filterState.favoritesOnly || a.is_favorite) &&
    (!filterState.sector || a.sector === filterState.sector) &&
    (!filterState.zone || a.geo_zone === filterState.zone)
  );

  if (sortMode === "alpha") {
    return { flat: [...list].sort((a, b) => a.ticker.localeCompare(b.ticker)) };
  }
  if (sortMode === "score") {
    return { flat: [...list].sort((a, b) => (b.score_agrege ?? -Infinity) - (a.score_agrege ?? -Infinity)) };
  }
  if (sortMode === "variation") {
    return { flat: [...list].sort((a, b) => (b.return_1d ?? -Infinity) - (a.return_1d ?? -Infinity)) };
  }

  const groupKey = sortMode === "zone" ? "geo_zone" : "sector";
  const groups = {};
  list.forEach(a => { (groups[a[groupKey]] ??= []).push(a); });
  Object.values(groups).forEach(g => g.sort((a, b) => a.ticker.localeCompare(b.ticker)));
  return { groups, groupKey };
}

function renderDashboard() {
  const view = document.getElementById("dashboard-cards");
  view.innerHTML = "";

  if (dashboardAssets.length === 0) {
    view.innerHTML = '<div class="empty-note">Aucune donnée de cours disponible pour le moment.</div>';
    return;
  }

  const { flat, groups, groupKey } = applyFiltersAndSort();

  if ((flat && flat.length === 0) || (groups && Object.keys(groups).length === 0)) {
    view.innerHTML = '<div class="empty-note">Aucun titre ne correspond aux filtres.</div>';
    return;
  }

  if (flat) {
    const grid = document.createElement("div");
    grid.className = "cards-grid";
    flat.forEach(asset => grid.appendChild(buildCard(asset)));
    view.appendChild(grid);
    return;
  }

  const keys = groupKey === "sector"
    ? SECTOR_ORDER.filter(s => groups[s]).concat(Object.keys(groups).filter(s => !SECTOR_ORDER.includes(s)))
    : Object.keys(groups).sort();

  for (const key of keys) {
    const section = document.createElement("section");
    section.className = "sector-section";
    if (groupKey === "sector") section.style.setProperty("--sector-color", sectorColor(key));

    const h2 = document.createElement("h2");
    h2.textContent = `${key} (${groups[key].length})`;
    section.appendChild(h2);

    const grid = document.createElement("div");
    grid.className = "cards-grid";
    groups[key].forEach(asset => grid.appendChild(buildCard(asset)));
    section.appendChild(grid);

    view.appendChild(section);
  }
}

document.getElementById("filter-favorites").addEventListener("change", (e) => {
  filterState.favoritesOnly = e.target.checked;
  renderDashboard();
});
document.getElementById("filter-sector").addEventListener("change", (e) => {
  filterState.sector = e.target.value;
  renderDashboard();
});
document.getElementById("filter-zone").addEventListener("change", (e) => {
  filterState.zone = e.target.value;
  renderDashboard();
});
document.getElementById("sort-select").addEventListener("change", (e) => {
  sortMode = e.target.value;
  renderDashboard();
});

async function archiveTicker(ticker, cardElement) {
  const res = await fetch(`/api/assets/${encodeURIComponent(ticker)}/archive`, { method: "PATCH" });
  if (res.ok) {
    dashboardAssets = dashboardAssets.filter(a => a.ticker !== ticker); // sinon reapparait au prochain filtre/tri
    cardElement.remove();
  } else {
    const err = await res.json().catch(() => ({}));
    alert(`Erreur lors de l'archivage : ${err.detail || res.statusText}`);
  }
}

async function loadArchived() {
  const view = document.getElementById("archived-view");
  view.innerHTML = '<div class="empty-note">Chargement…</div>';

  const res = await fetch("/api/assets");
  const rows = (await res.json()).filter(a => !a.is_active);

  if (rows.length === 0) {
    view.innerHTML = '<div class="empty-note">Aucune action archivée.</div>';
    return;
  }

  const table = document.createElement("table");
  table.className = "archived-table";
  table.innerHTML = `
    <thead><tr><th>Ticker</th><th>Nom</th><th>Secteur</th><th>Type</th><th></th></tr></thead>
    <tbody></tbody>
  `;

  rows.forEach(a => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${a.ticker}</td>
      <td>${a.name}</td>
      <td>${a.sector || "—"}</td>
      <td>${a.asset_type}</td>
      <td></td>
    `;
    const btn = document.createElement("button");

    btn.addEventListener("click", async () => {

function showTab(tab) {
  document.getElementById("dashboard-view").classList.toggle("hidden", tab !== "dashboard");
  document.getElementById("tracking-view").classList.toggle("hidden", tab !== "tracking");
  document.getElementById("archived-view").classList.toggle("hidden", tab !== "archived");
  document.getElementById("tab-dashboard-btn").classList.toggle("active", tab === "dashboard");
  document.getElementById("tab-tracking-btn").classList.toggle("active", tab === "tracking");
  document.getElementById("tab-archived-btn").classList.toggle("active", tab === "archived");
  if (tab === "archived") loadArchived();
  if (tab === "tracking") loadTrackingTab();
}

const TRACKING_HORIZON_LABELS = ["J+1", "J+7", "J+30"];
const STATUS_LABELS = { correct: "Correct", incorrect: "Incorrect", neutral: "Neutre", pending: "En attente", no_data: "Pas de donnée" };

async function loadTrackingTab() {
  const select = document.getElementById("tracking-ticker-select");
  if (!select.dataset.populated) {
    const res = await fetch("/api/assets");
    const assets = (await res.json()).filter(a => a.is_active).sort((a, b) => a.ticker.localeCompare(b.ticker));
    select.innerHTML = '<option value="">Tous les titres</option>' + assets.map(a => `<option value="${a.ticker}">${a.ticker}</option>`).join("");
    select.dataset.populated = "1";
  }
  loadTracking(select.value || null);
}

function horizonCell(h) {
  if (!h) return '<span class="status-badge status-no_data">—</span>';
  const label = STATUS_LABELS[h.status] || h.status;
  const pct = h.actual_return !== null && h.actual_return !== undefined
    ? `<span class="status-return">${h.actual_return >= 0 ? "+" : ""}${(h.actual_return * 100).toFixed(1)}%</span>`
    : "";
  return `<span class="status-badge status-${h.status}">${label}</span>${pct}`;
}

function trackingRow(ticker, isFirstOfGroup, rowLabel, rec, isAggregate, groupSize) {
  const tr = document.createElement("tr");
  tr.className = (isFirstOfGroup ? "ticker-group-start " : "") + (isAggregate ? "row-aggregate" : "");
  const tickerCell = isFirstOfGroup ? `<td class="ticker-cell" rowspan="${groupSize}">${ticker}</td>` : "";
  if (!rec) {
    tr.innerHTML = `${tickerCell}<td>${rowLabel}</td><td colspan="${2 + TRACKING_HORIZON_LABELS.length}" class="empty-note" style="padding:8px 12px;">Aucune prédiction</td>`;
    return tr;
  }
  const horizonsCells = TRACKING_HORIZON_LABELS.map(l => `<td>${horizonCell(rec.horizons[l])}</td>`).join("");
  tr.innerHTML = `
    ${tickerCell}
    <td>${rowLabel}</td>
    <td>${rec.recommendation || "—"}</td>
    <td>${rec.score !== null && rec.score !== undefined ? rec.score.toFixed(0) : "—"}</td>
    ${horizonsCells}
  `;
  return tr;
}

async function loadTracking(ticker) {
  const wrap = document.getElementById("tracking-table-wrap");
  wrap.innerHTML = '<div class="empty-note">Chargement…</div>';

  const url = ticker ? `/api/predictions/tracking?ticker=${encodeURIComponent(ticker)}` : "/api/predictions/tracking";
  const res = await fetch(url);
  const rows = await res.json();

  if (rows.length === 0) {
    wrap.innerHTML = '<div class="empty-note">Aucune prédiction stockée pour ce titre.</div>';
    return;
  }

  const table = document.createElement("table");
  table.className = "tracking-table";
  table.innerHTML = `
    <thead><tr><th>Titre</th><th>Source</th><th>Reco</th><th>Score</th>${TRACKING_HORIZON_LABELS.map(l => `<th>${l}</th>`).join("")}</tr></thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector("tbody");

  // Ordre d'affichage prefere pour les providers connus, mais n'importe quel
  // provider present dans la reponse est affiche (fallback alphabetique) --
  // pas besoin de toucher ce fichier pour qu'un nouveau provider apparaisse.
  const PREFERRED_PROVIDER_ORDER = ["deepseek", "gemini", "claude", "nemotron"];
  const allProviders = new Set();
  rows.forEach(entry => entry.providers.forEach(p => allProviders.add(p.provider)));
  const providerOrder = PREFERRED_PROVIDER_ORDER.filter(p => allProviders.has(p))
    .concat([...allProviders].filter(p => !PREFERRED_PROVIDER_ORDER.includes(p)).sort());
  const groupSize = providerOrder.length + 1; // + 1 ligne Agrégat

  rows.forEach(entry => {
    const byProvider = Object.fromEntries(entry.providers.map(p => [p.provider, p]));
    let first = true;
    providerOrder.forEach(p => {
      tbody.appendChild(trackingRow(entry.ticker, first, p, byProvider[p], false, groupSize));
      first = false;
    });
    tbody.appendChild(trackingRow(entry.ticker, false, "Agrégat", entry.aggregate, true, groupSize));
  });

  wrap.innerHTML = "";
  wrap.appendChild(table);
}

function populateSectorSelect(sectors) {

  const score = agg.score_agrege !== null && agg.score_agrege !== undefined ? Math.round(agg.score_agrege) : "—";
  return `
    <div class="conviction-row">
      <div class="conviction-label"><span>Score agrégé : ${agg.recommendation_finale || "—"} ${score}</span><span>Conviction : ${agg.conviction.toFixed(2)}</span></div>
      <div class="conviction-track"><div class="conviction-fill" style="width:${pct}%; background:${color};"></div></div>

function fmtNewsSentiment(score) {

  return `<span class="return-badge ${cls}" style="font-size:10px; padding:1px 5px; margin-left:6px;">${score >= 0 ? "+" : ""}${score.toFixed(2)}</span>`;
}

function newsItemHtml(item, withSummary) {

    <div class="news-item">
      <div class="news-item-title">${esc(item.title)}${fmtNewsSentiment(item.sentiment_score)}</div>

      ${withSummary && item.summary ? `<div class="news-item-summary">${esc(item.summary)}</div>` : ""}

function newsListSection(fiche) {
  if (!fiche) return '<div class="empty-note">Données de news indisponibles.</div>';
  const recent = (fiche.news && fiche.news.last_7d) || [];
  const older = (fiche.news && fiche.news.last_8_30d) || [];
  if (recent.length === 0 && older.length === 0) {
    return '<div class="empty-note">Aucune news collectée récemment pour ce titre.</div>';
  }
  return `
    ${recent.length ? `<h4 class="news-subheading">7 derniers jours (${recent.length})</h4>${recent.map(n => newsItemHtml(n, true)).join("")}` : ""}
    ${older.length ? `<h4 class="news-subheading">8-30 derniers jours (${older.length})</h4>${older.map(n => newsItemHtml(n, false)).join("")}` : ""}
  `;
}

function valuationSection(fiche) {
  if (!fiche) return '<div class="empty-note">Données de valorisation indisponibles.</div>';

  const val = fiche.valorisation || {};
  const consensus = fiche.consensus_analystes || {};
  const targetsA = (fiche.targets && fiche.targets.analystes) || {};
  const targetsT = fiche.targets && fiche.targets.technique_probastock;

  const perCourant = val.per_annee_courante_label || (val.per_annee_courante != null ? val.per_annee_courante.toFixed(2) : "N/A");
  const perY1 = val.per_y1_label || (val.per_y1 != null ? val.per_y1.toFixed(2) : "N/A");

  let targetAnalysteHtml;
  if (targetsA.label_absence) {
    targetAnalysteHtml = `<p>${targetsA.label_absence}</p>`;
  } else {
    const nbAnalystes = consensus.nb_analystes ? ` (${consensus.nb_analystes} analystes)` : "";
    targetAnalysteHtml = `
      <p>Moyenne : ${targetsA.mean != null ? targetsA.mean.toFixed(2) : "N/A"}${nbAnalystes}</p>
      <p>Haut : ${targetsA.high != null ? targetsA.high.toFixed(2) : "N/A"} / Bas : ${targetsA.low != null ? targetsA.low.toFixed(2) : "N/A"}</p>
    `;
  }

  const targetTechHtml = targetsT
    ? `
      <p>Haut : ${targetsT.high.toFixed(2)} / Bas : ${targetsT.low.toFixed(2)}</p>
      <p style="font-size:11px; color:var(--text-muted);">${targetsT.n_seances_disponibles}/${targetsT.n_seances_visees} séances, élargi de +/- volatilité 20j</p>
    `
    : "<p>N/A</p>";

  return `
    <div class="analysis-grid">
      <div>
        <h4>PER</h4>
        <p>Année courante : ${perCourant}</p>
        <p>Y+1 (estimation) : ${perY1}</p>
      </div>
      <div>
        <h4>Target analystes</h4>
        ${targetAnalysteHtml}
      </div>
      <div>
        <h4>Target technique Probastock</h4>
        ${targetTechHtml}
      </div>
    </div>
  `;
}

function renderDetail(data) {
  document.getElementById("detail-ticker").textContent = data.ticker;
  document.getElementById("detail-name").textContent = data.name;
  document.getElementById("detail-sector").textContent = data.sector || "—";

  document.getElementById("detail-body").innerHTML = `
    <div class="chart-section">
      <h3>Cours de clôture — SMA-20 / SMA-50</h3>
      <div class="chart-main-wrap"><canvas id="detail-main-chart"></canvas></div>
    </div>
    <div class="chart-section">
      <h3>RSI-14 (${data.indicators_history.length} derniers jours)</h3>
      <div class="chart-rsi-wrap"><canvas id="detail-rsi-chart"></canvas></div>
    </div>
    <div class="chart-section">
      <h3>Signal technique (RSI) — indépendant de l'analyse IA</h3>
      ${technicalSection(data.technical_signal)}
    </div>
    <div class="chart-section">
      <h3>Volume</h3>
      <div class="chart-volume-wrap"><canvas id="detail-volume-chart"></canvas></div>
    </div>
    <div class="chart-section">
      <h3>Valorisation &amp; Targets</h3>
      ${valuationSection(data.fiche)}
    </div>
    <div class="chart-section" id="detail-news-section">
      <h3>News</h3>
      ${newsListSection(data.fiche)}
    </div>
    <div class="chart-section">
      <h3>Analyse Probastock</h3>
      ${convictionBlock(data.aggregated)}
      <div id="analysis-box">
        <div class="analysis-placeholder">
          <span>Aucune analyse IA pour l'instant.</span>
          <button class="btn-primary" onclick="runAnalysis('${data.ticker}')">Analyser maintenant (DeepSeek)</button>
        </div>
      </div>
    </div>
  `;

  Object.values(detailCharts).forEach(c => c.destroy());
  detailCharts = {};

  if (data.price_history.length === 0) {
    document.querySelector(".chart-main-wrap").outerHTML = '<div class="empty-note">Aucun cours collecté pour cet actif pour le moment.</div>';
    return;
  }

  const priceLabels = data.price_history.map(p => p.trade_date);
  const closeValues = data.price_history.map(p => p.close);

  // sma_20/sma_50 ne couvrent que les 90 derniers jours (cf. /api/assets/{ticker}/detail) :
  // on aligne sur les dates de prix (historique complet) et on comble par null ailleurs,
  // Chart.js (spanGaps) se charge d'ignorer les trous plutot que de tracer une fausse ligne.
  const indicatorsByDate = Object.fromEntries(data.indicators_history.map(i => [i.trade_date, i]));
  const sma20 = priceLabels.map(d => indicatorsByDate[d]?.sma_20 ?? null);
  const sma50 = priceLabels.map(d => indicatorsByDate[d]?.sma_50 ?? null);

  detailCharts.main = new Chart(document.getElementById("detail-main-chart"), {
    type: "line",
    data: {
      labels: priceLabels,
      datasets: [
        { label: "Close", data: closeValues, borderColor: "#2563eb", borderWidth: 1.5, pointRadius: 0, tension: 0.15 },
        { label: "SMA-20", data: sma20, borderColor: "#f59e0b", borderWidth: 1.5, pointRadius: 0, tension: 0.15, spanGaps: true },
        { label: "SMA-50", data: sma50, borderColor: "#8b5cf6", borderWidth: 1.5, pointRadius: 0, tension: 0.15, spanGaps: true },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      scales: { x: { ticks: { maxTicksLimit: 10 } } },
      plugins: { legend: { display: true, position: "top", labels: { boxWidth: 12 } } },
    },
  });

  const rsiLabels = data.indicators_history.map(i => i.trade_date);
  const rsiValues = data.indicators_history.map(i => i.rsi_14);

  detailCharts.rsi = new Chart(document.getElementById("detail-rsi-chart"), {
    type: "line",
    data: {
      labels: rsiLabels,
      datasets: [
        { label: "RSI-14", data: rsiValues, borderColor: "#0891b2", borderWidth: 1.5, pointRadius: 0, tension: 0.15, spanGaps: true },
        { label: "Surachat (70)", data: rsiLabels.map(() => 70), borderColor: "#dc2626", borderWidth: 1, borderDash: [4, 4], pointRadius: 0 },
        { label: "Survente (30)", data: rsiLabels.map(() => 30), borderColor: "#16a34a", borderWidth: 1, borderDash: [4, 4], pointRadius: 0 },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { y: { min: 0, max: 100 }, x: { ticks: { maxTicksLimit: 8 } } },
      plugins: { legend: { display: true, position: "top", labels: { boxWidth: 12 } } },
    },
  });

  const volumeValues = data.price_history.map(p => p.volume);

  detailCharts.volume = new Chart(document.getElementById("detail-volume-chart"), {
    type: "bar",
    data: {
      labels: priceLabels,
      datasets: [{ label: "Volume", data: volumeValues, backgroundColor: "#94a3b8" }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { x: { ticks: { maxTicksLimit: 10 } } },
      plugins: { legend: { display: false } },
    },
  });
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function renderAnalysisResult(data) {
  const a = data.analysis;
  const dirClass = a.direction === "bullish" ? "return-up" : a.direction === "bearish" ? "return-down" : "return-flat";
  const list = (items) => (items && items.length)
    ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`
    : "<span>—</span>";

  return `
    <div class="analysis-result">
      <div class="analysis-header">
        <span class="return-badge ${dirClass}">${a.direction.toUpperCase()}</span>
        <span>Score : <b>${a.score}/100</b></span>
        <span>Probabilité 20j : <b>${(a.probability_20d * 100).toFixed(0)}%</b></span>
        <span>Confiance : <b>${(a.confidence * 100).toFixed(0)}%</b></span>
        <span>Risque : <b>${(a.risk * 100).toFixed(0)}%</b></span>
      </div>
      <div class="analysis-grid">
        <div><h4>Facteurs positifs</h4>${list(a.key_positive_factors)}</div>
        <div><h4>Facteurs négatifs</h4>${list(a.key_negative_factors)}</div>
        <div><h4>Catalyseurs</h4>${list(a.catalysts)}</div>
        <div><h4>Signaux d'alerte</h4>${list(a.red_flags)}</div>
      </div>
      <div class="analysis-meta">${esc(data.provider)} (${esc(data.model)}) — ${data.tokens_input}+${data.tokens_output} tokens</div>
      <button class="btn-secondary" onclick="runAnalysis('${data.ticker}')">Relancer l'analyse</button>
    </div>
  `;
}

async function runAnalysis(ticker) {
  const box = document.getElementById("analysis-box");
  box.innerHTML = '<div class="analysis-loading">Analyse DeepSeek en cours… (quelques secondes)</div>';

  let res, data;
  try {
    res = await fetch(`/api/assets/${encodeURIComponent(ticker)}/analyze`, { method: "POST" });
    data = await res.json();
  } catch (e) {
    box.innerHTML = `<div class="analysis-error"><span>Erreur réseau : ${esc(String(e))}</span><button class="btn-secondary" onclick="runAnalysis('${ticker}')">Réessayer</button></div>`;
    return;
  }

  if (!res.ok) {
    box.innerHTML = `<div class="analysis-error"><span>Erreur : ${esc(data.detail || res.statusText)}</span><button class="btn-secondary" onclick="runAnalysis('${ticker}')">Réessayer</button></div>`;
    return;
  }
  if (!data.ok) {
    box.innerHTML = `<div class="analysis-error"><span>Échec de l'analyse : ${esc(data.error || "raison inconnue")}</span><button class="btn-secondary" onclick="runAnalysis('${ticker}')">Réessayer</button></div>`;
    return;
  }

  box.innerHTML = renderAnalysisResult(data);
}

loadDashboard();
</script>

</html>
